name: package linux

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      discussions: write
      deployments: write
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node-version: [24.x]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Force Node.js 24 for all actions

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch LFS objects
        run: |
          git lfs install
          git lfs pull

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm run test

      - name: prepare-package
        run: npm run prepare-package

      - name: package arm64
        if: runner.arch == 'ARM64'
        run: npm run package -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: package x64
        if: runner.arch == 'X64'
        run: npm run package -- --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build linux snap
        uses: snapcore/action-build@v1
        id: build
        with:
          # Avoids provisioning a fresh LXD container whose apt index can drift out of sync with the mirror.
          snapcraft-args: --destructive-mode

      - name: publish to snap store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  flathub-sync:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Generate Flatpak manifest
        run: node tools/configure.js ./flatpak

      - name: Set up Python
        uses: actions/setup-python@v6

      - name: Install flatpak-node-generator
        run: pip install "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"

      - name: Regenerate generated-sources.json
        run: flatpak-node-generator npm package-lock.json -o generated-sources.json

      - name: Open update PR on the Flathub repo
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_PUSH_TOKEN }}
        run: |
          set -e
          BRANCH="update-${GITHUB_REF_NAME}"
          MANIFEST=io.github.xfuentes.smart-video-processor.yml

          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/flathub/io.github.xfuentes.smart-video-processor.git" flathub-repo
          cd flathub-repo

          EXISTING=$(gh pr list --repo flathub/io.github.xfuentes.smart-video-processor --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "A PR for $BRANCH is already open, skipping"
            exit 0
          fi

          git checkout -b "$BRANCH"
          cp "../flatpak/$MANIFEST" "./$MANIFEST"
          cp ../generated-sources.json ./generated-sources.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" generated-sources.json

          if git diff --cached --quiet; then
            echo "Manifest and sources already up to date, nothing to publish"
            exit 0
          fi

          git commit -m "smart-video-processor: update to ${GITHUB_REF_NAME}"
          git push origin "$BRANCH"

          gh pr create --repo flathub/io.github.xfuentes.smart-video-processor \
            --base master --head "$BRANCH" \
            --title "smart-video-processor: update to ${GITHUB_REF_NAME}" \
            --body "Automated update to ${GITHUB_REF_NAME}: bumps the app source tag and regenerates generated-sources.json to match this release's package-lock.json."
