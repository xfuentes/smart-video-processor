name: package win32

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

jobs:
  # Creates the draft release once, so the parallel packaging jobs (and the other workflow) all upload to the same draft.
  draft-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: draft-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Create the draft release if it does not exist yet
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id' | head -n 1)
          if [ -z "$existing" ]; then
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes ""
          else
            echo "Release ${{ github.ref_name }} already exists (id $existing)"
          fi

  release:
    needs: draft-release
    permissions:
      contents: write
      discussions: write
      deployments: write
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-2025, windows-11-arm]
        node-version: [24.x]
    env: # Force Node.js 24 for all actions
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch LFS objects
        run: |
          git lfs install
          git lfs pull

      - name: Install Windows SDK
        if: runner.os == 'Windows'
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm run test

      - name: prepare-package
        run: npm run prepare-package

      - name: package arm64
        if: runner.arch == 'ARM64'
        run: npm run package -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: package x64
        if: runner.arch == 'X64'
        run: npm run package -- --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
