app-id: __APP_ID__
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '25.08'
    directory: lib/ffmpeg
    add-ld-path: lib
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
separate-locales: false
command: __APP_ID__
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-run/app
modules:
  - name: mkvtoolnix
    buildsystem: simple
    only-arches:
      - x86_64
    build-commands:
      - chmod +x MKVToolNix_GUI-100.0-x86_64.AppImage
      - ./MKVToolNix_GUI-100.0-x86_64.AppImage --appimage-extract >/dev/null
      - install -Dm755 squashfs-root/usr/bin/mkvmerge /app/bin/mkvmerge
      - |
        set -e
        install -d /app/lib
        for lib in $(LD_LIBRARY_PATH=$(pwd)/squashfs-root/usr/lib ldd /app/bin/mkvmerge | awk '/=> \// {print $3}' | sort -u); do
          case "$lib" in
            */squashfs-root/usr/lib/*)
              cp -L "$lib" /app/lib/ 2>/dev/null || true
              ;;
            /app/lib/*|*linux-vdso*|*ld-linux*|*libc.so*|*libm.so*|*libpthread.so*|*libdl.so*|*librt.so*|*libgcc_s.so*|*libstdc++.so*) ;;
            *)
              cp -L "$lib" /app/lib/ 2>/dev/null || true
              ;;
          esac
        done
    sources:
      - type: file
        url: https://mkvtoolnix.download/appimage/MKVToolNix_GUI-100.0-x86_64.AppImage
        sha256: 159f7a6eea5b9c042f248ae8a3b2a7e2311f22841a118c26d6250f17d32eb655
        dest-filename: MKVToolNix_GUI-100.0-x86_64.AppImage

  - name: __NAME__
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        npm_config_nodedir: /usr/lib/sdk/node22

    build-commands:
      - mkdir -p native/uwp-activation/build/Release dist/bin
      - yarn install --immutable --immutable-cache
      - yarn build
      - npx electron-builder --dir --publish never
      - install -d /app/lib/__NAME__
      - cp -r dist/linux*unpacked/* /app/lib/__NAME__/
      - node tools/configure.js ./flatpak
      - install -Dm644 flatpak/__APP_ID__.desktop /app/share/applications/__APP_ID__.desktop
      - install -Dm644 flatpak/__APP_ID__.metainfo.xml /app/share/metainfo/__APP_ID__.metainfo.xml
      - install -Dm644 resources/icon.svg /app/share/icons/hicolor/scalable/apps/__APP_ID__.svg
      - install -Dm755 run.sh /app/bin/__APP_ID__
    sources:
      - type: git
        url: https://github.com/xfuentes/__NAME__.git
        tag: v__VERSION__
      - node-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - export PATH="/app/bin:/usr/bin:/app/lib/ffmpeg/bin:$PATH"
          - export LD_LIBRARY_PATH="/app/lib:/app/lib/ffmpeg/lib:$LD_LIBRARY_PATH"
          - exec zypak-wrapper.sh /app/lib/__NAME__/__NAME__ "$@"
