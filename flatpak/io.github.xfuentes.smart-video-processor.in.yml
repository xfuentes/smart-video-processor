app-id: __APP_ID__
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '25.08'
    directory: lib/ffmpeg
    add-ld-path: lib
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
separate-locales: false
command: __APP_ID__
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=xdg-run/app
modules:
  - name: mkvtoolnix
    buildsystem: simple
    build-commands:
      - ar x mkvtoolnix_101.0-1_${FLATPAK_ARCH}.deb data.tar.xz
      - tar -xJf data.tar.xz
      - install -D usr/bin/mkvmerge /app/bin/mkvmerge
      - |
        find usr/lib -type f -name '*.so*' -exec cp -t /app/lib {} +
        find usr/lib -type l -name '*.so*' -exec cp -t /app/lib {} +
      - rm -rf usr data.tar.xz
    sources:
      - type: file
        url: http://deb.debian.org/debian/pool/main/m/mkvtoolnix/mkvtoolnix_101.0-1_amd64.deb
        sha256: ed3ae53f73e7d1c4f71ddb517f5d4244e37f5ed5f3834fdc28f6e194080d12c1
        dest-filename: mkvtoolnix_101.0-1_x86_64.deb
        only-arches:
          - x86_64
      - type: file
        url: http://deb.debian.org/debian/pool/main/m/mkvtoolnix/mkvtoolnix_101.0-1_arm64.deb
        sha256: c6fe465313501f4ab245b1e483089db99e346cbccc6bd3b6065135dbddeea3d8
        dest-filename: mkvtoolnix_101.0-1_aarch64.deb
        only-arches:
          - aarch64

  - name: __NAME__
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node22/bin
      env:
        npm_config_nodedir: /usr/lib/sdk/node22
        YARN_ENABLE_TELEMETRY: '0'
        YARN_ENABLE_NETWORK: '0'
        YARN_ENABLE_GLOBAL_CACHE: '0'
        YARN_ENABLE_INLINE_BUILDS: '1'
        YARN_GLOBAL_FOLDER: /run/build/__NAME__/flatpak-node/yarn-berry
        YARN_CACHE_FOLDER: /run/build/__NAME__/flatpak-node/yarn-berry/cache
        ELECTRON_CACHE: /run/build/__NAME__/flatpak-node/cache/electron

    build-commands:
      - mkdir -p native/uwp-activation/build/Release
      - yarn config
      - yarn plugin import $FLATPAK_BUILDER_BUILDDIR/flatpak-node/flatpak-yarn.js
      - yarn convertToZip $(which yarn)
      - yarn install --immutable
      - yarn build
      - . flatpak-node/electron-builder-arch-args.sh
      - npx electron-builder --linux $ELECTRON_BUILDER_ARCH_ARGS --dir --publish never
      - rm -f dist/linux*unpacked/resources/bin/ffmpeg
      - rm -f dist/linux*unpacked/resources/bin/ffprobe
      - rm -f dist/linux*unpacked/resources/bin/mkvmerge
      - install -d /app/lib/__NAME__
      - cp -r dist/linux*unpacked/* /app/lib/__NAME__/
      - node tools/configure.js ./flatpak
      - install -Dm644 flatpak/__APP_ID__.desktop /app/share/applications/__APP_ID__.desktop
      - install -Dm644 flatpak/__APP_ID__.metainfo.xml /app/share/metainfo/__APP_ID__.metainfo.xml
      - install -Dm644 resources/icon.svg /app/share/icons/hicolor/scalable/apps/__APP_ID__.svg
      - install -Dm755 run.sh /app/bin/__APP_ID__
    sources:
      - type: git
        url: https://github.com/xfuentes/__NAME__.git
        branch: main
      - flatpak/generated-sources.json
      - type: script
        dest-filename: run.sh
        commands:
          - export PATH="/app/bin:/usr/bin:/app/lib/ffmpeg/bin:$PATH"
          - export LD_LIBRARY_PATH="/app/lib:/app/lib/ffmpeg/lib:$LD_LIBRARY_PATH"
          - exec zypak-wrapper.sh /app/lib/__NAME__/__NAME__ "$@"
