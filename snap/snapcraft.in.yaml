name: __NAME__
title: Smart Video Processor
version: __VERSION__
summary: Organize your movies and shows
description: |
  Smart Video Processor tidies up your movie and TV show collection. It recognizes each video
  using online databases, then renames the files so that media servers such as Jellyfin find them,
  adds posters and details, fixes the language of audio and subtitle tracks, joins or splits files
  and converts them to a lighter format, all in one place.

license: GPL-3.0+
contact: xfuentes-dev@serviam.cc
issues: https://github.com/xfuentes/smart-video-processor/issues
source-code: https://github.com/xfuentes/smart-video-processor
website: https://github.com/xfuentes/smart-video-processor
donation: https://paypal.me/xfuentesdev

base: core24
grade: stable
confinement: strict
compression: lzo

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: D9199745B0545F2E8197062B0F92290A445B9007
    url: https://mkvtoolnix.download/ubuntu

apps:
  smart-video-processor:
    command: bin/app/smart-video-processor --no-sandbox
    extensions:
      - gnome
    plugs:
      - home
      - shared-memory
      - network
      - removable-media
      - audio-playback
      - ffmpeg-2404
    environment:
      PATH: $SNAP/ffmpeg-platform/usr/bin:$SNAP/usr/bin:$PATH
      LD_LIBRARY_PATH: $SNAP/ffmpeg-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/ffmpeg-platform/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/vdpau:$SNAP/ffmpeg-platform/usr/lib:$LD_LIBRARY_PATH

parts:
  smart-video-processor:
    plugin: dump
    source: dist/linux__ARCH_SUFFIX__-unpacked
    source-type: local
    organize:
      '*': bin/app/
    override-prime: |
      craftctl default
      rm -f $CRAFT_PRIME/bin/app/libvulkan.so.1

  mkvmerge:
    plugin: nil
    stage-packages:
      - mkvtoolnix
    override-prime: |
      mkdir -p $CRAFT_PRIME/usr/bin $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      cp -f $CRAFT_STAGE/usr/bin/mkvmerge $CRAFT_PRIME/usr/bin/
      export LD_LIBRARY_PATH=$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_STAGE/usr/lib:$LD_LIBRARY_PATH
      ldd $CRAFT_STAGE/usr/bin/mkvmerge | grep "=> $CRAFT_STAGE" | awk '{print $3}' | while read -r lib; do
      if [ -f "$lib" ]; then
        cp -Lf "$lib" $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/
      fi
      done || true

plugs:
  ffmpeg-2404:
    interface: content
    target: $SNAP/ffmpeg-platform
    default-provider: ffmpeg-2404
  shared-memory:
    private: true
  removable-media:
    # Request to allow this by default so end users can process their removable medias
    allow-auto-connection: true
